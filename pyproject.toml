[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litengram"
version = "1.3.0"
description = "Structured knowledge framework for academic reading with Zotero"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "requests>=2.28.0",
    "sqlite3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
]

[project.urls]
Repository = "https://github.com/cyracaid/litengram"

[tool.setuptools]
packages = ["scripts"]
